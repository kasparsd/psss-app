<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passkey and password · Sample Site</title><link rel="stylesheet" href="style.css">
<h1>Passkey and password</h1>
<p>Reproduces sites such as Google: the page asks for a passkey as soon as it loads (a conditional request), and the person
may still want the saved password. Choose Psss from the keyboard bar or AutoFill. The list must offer the saved login as well
as any passkey.</p>
<form onsubmit="return false">
  <label for="u">Email</label>
  <input id="u" type="email" autocomplete="username webauthn" autocapitalize="none">
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password">
</form>
<pre id="out">Ready.</pre>
<script>
const out = (t) => document.getElementById('out').textContent = t;
const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
async function start() {
  if (!window.PublicKeyCredential || !(await PublicKeyCredential.isConditionalMediationAvailable?.())) {
    return out('Conditional mediation is not available in this browser, so no passkey request is pending.');
  }
  out('Conditional passkey request pending. Choose Psss in the keyboard bar or AutoFill.');
  try {
    const a = await navigator.credentials.get({ publicKey: { challenge: rand(32), rpId: location.hostname,
      userVerification: 'preferred' }, mediation: 'conditional' });
    out('Signed in with a passkey ✓\nid: ' + b64(a.rawId) + '\nuser handle: ' + (a.response.userHandle ? b64(a.response.userHandle) : '-'));
  } catch (e) { out('Passkey request ended: ' + e.name + ' ' + e.message); }
}
start();
</script>
