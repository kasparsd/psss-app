<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passkeys · Sample Site</title><link rel="stylesheet" href="style.css">
<h1>Passkeys</h1>
<p>Create a passkey, then sign in with it. The page verifies the signature in the browser.</p>
<form onsubmit="return false">
  <label for="u">Email</label>
  <input id="u" value="alex@example.net" type="email" autocomplete="username webauthn" autocapitalize="none">
  <button id="create">Create passkey</button>
  <button id="signin">Sign in with a passkey</button>
</form>
<pre id="out">Ready.</pre>
<script>
const out = (t) => document.getElementById('out').textContent = t;
const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
// DER ECDSA signature -> raw r||s for WebCrypto.
function derToRaw(der) {
  const d = new Uint8Array(der); let i = 2;
  const read = () => { i++; let len = d[i++]; let v = d.slice(i, i + len); i += len;
    while (v.length > 32 && v[0] === 0) v = v.slice(1);
    const o = new Uint8Array(32); o.set(v, 32 - v.length); return o; };
  const r = read(), s = read(); const raw = new Uint8Array(64); raw.set(r, 0); raw.set(s, 32); return raw;
}
document.getElementById('create').onclick = async () => {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rand(32), rp: { id: location.hostname, name: 'Sample Site' },
      user: { id: rand(16), name: document.getElementById('u').value, displayName: 'Alex' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
      authenticatorSelection: { residentKey: 'required', userVerification: 'preferred' },
      attestation: 'none', timeout: 120000 } });
    localStorage.setItem('pk', JSON.stringify({ id: b64(cred.rawId), key: b64(cred.response.getPublicKey()) }));
    out('Passkey created ✓\nid: ' + b64(cred.rawId) + '\nalgorithm: ' + cred.response.getPublicKeyAlgorithm());
  } catch (e) { out('Create failed: ' + e.name + ' ' + e.message); }
};
document.getElementById('signin').onclick = async () => {
  try {
    const challenge = rand(32);
    const a = await navigator.credentials.get({ publicKey: { challenge, rpId: location.hostname,
      userVerification: 'preferred', timeout: 120000 } });
    const stored = JSON.parse(localStorage.getItem('pk') || 'null');
    let verdict = 'no stored public key to verify against (create a passkey on this page first)';
    if (stored && stored.id === b64(a.rawId)) {
      const spki = Uint8Array.from(atob(stored.key.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
      const key = await crypto.subtle.importKey('spki', spki, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', a.response.clientDataJSON));
      const data = new Uint8Array([...new Uint8Array(a.response.authenticatorData), ...hash]);
      const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, derToRaw(a.response.signature), data);
      verdict = ok ? 'signature verified ✓' : 'signature INVALID ✗';
    }
    out('Signed in ✓\nid: ' + b64(a.rawId) + '\nuser handle: ' + (a.response.userHandle ? b64(a.response.userHandle) : '-') + '\n' + verdict);
  } catch (e) { out('Sign in failed: ' + e.name + ' ' + e.message); }
};
</script>
