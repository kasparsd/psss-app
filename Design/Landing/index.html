<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psss Passwords</title>
<link rel="stylesheet" href="../Brand/tokens.css">
<!-- Self-host Varela Round (OFL) and Nunito here with @font-face, then remove this note.
     Until the font files are added, the stack falls back to the system rounded font. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--psss-butter); color: var(--psss-charcoal); font-family: var(--psss-font-body); }
  main { min-height: 100vh; padding: 72px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 40px; overflow: hidden; }
  .lockup { display: flex; align-items: center; gap: 8px; }
  .lockup img { width: 120px; height: 120px; }
  .wordmark { font-family: var(--psss-font-display); font-size: calc(120px * var(--psss-wordmark-ratio)); line-height: 1; letter-spacing: -.01em; transform: translateY(-.06em); }
  h1 { margin: 0; max-width: 820px; text-align: center; font: 400 clamp(36px, 5vw, 64px)/1.1 var(--psss-font-display); letter-spacing: -.01em; }
  .badge { display: inline-flex; flex-direction: column; background: #000; color: #fff; border-radius: 12px; padding: 10px 22px; min-height: 56px; text-decoration: none; line-height: 1.1; font-family: system-ui, sans-serif; }
  .badge:focus-visible { outline: 3px solid var(--psss-charcoal); outline-offset: 3px; }
  .badge small { font-size: 11px; }
  .badge b { font-size: 24px; font-weight: 600; }
  .shots { display: flex; justify-content: center; align-items: flex-start; gap: 28px; width: 100%; max-width: 1000px; height: 520px; overflow: hidden; margin-top: 16px; }
  .shots img { flex: 0 1 300px; min-width: 0; height: auto; border-radius: 48px; box-shadow: 0 30px 60px -20px rgba(31, 31, 35, .45); }
  .shots img:nth-child(odd) { margin-top: 56px; }
  @media (max-width: 860px) { .shots img:not(:nth-child(2)) { display: none; } }
</style>
</head>
<body>
<main>
  <div class="lockup">
    <img src="../AppIcon/Psss-mark.svg" alt="">
    <span class="wordmark">psss</span>
  </div>
  <h1>Secure passwords for the rest of us.</h1>
  <!-- Replace with Apple's official badge artwork and the App Store link when the app has an address. -->
  <a class="badge" href="#" aria-label="Download psss on the App Store"><small>Download on the</small><b>App Store</b></a>
  <div class="shots">
    <!-- Real screenshots go here, in device frames: welcome, passwords list, item detail. -->
  </div>
</main>
</body>
</html>
