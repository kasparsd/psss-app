<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psss</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="4 32 118 56" aria-hidden="true" focusable="false">
<rect x="6.5" y="34.5" width="113" height="51" rx="25.5" fill="none" stroke="currentColor" stroke-width="5"/>
<g fill="currentColor" stroke="currentColor" stroke-width="2.394" stroke-linejoin="round"><path d="M22.301 79.415Q21.549 79.415 21.033 78.88Q20.518 78.345 20.518 77.592L20.518 51.481Q20.518 50.728 21.033 50.213Q21.549 49.698 22.301 49.698Q23.094 49.698 23.609 50.213Q24.124 50.728 24.124 51.481L24.124 52.511Q25.511 51.085 27.175 50.292Q28.839 49.5 30.9 49.5Q33.316 49.5 35.496 50.728Q37.675 51.957 39.082 54.294Q40.488 56.632 40.488 60Q40.488 63.368 39.082 65.706Q37.675 68.043 35.496 69.272Q33.316 70.5 30.9 70.5Q28.839 70.5 27.175 69.708Q25.511 68.915 24.124 67.489L24.124 77.592Q24.124 78.345 23.609 78.88Q23.094 79.415 22.301 79.415ZM30.384 67.132Q33.198 67.132 35.04 65.309Q36.882 63.487 36.882 60Q36.882 56.474 35.04 54.671Q33.198 52.868 30.384 52.868Q28.443 52.868 26.858 53.72Q25.273 54.571 24.124 55.84L24.124 64.16Q25.273 65.429 26.858 66.28Q28.443 67.132 30.384 67.132Z"/></g>
<path d="M19.321 72H25.321V87.192A28 28 0 0 1 19.321 84.965Z" fill="currentColor"/>
<g fill="currentColor"><circle cx="54.518" cy="60" r="7"/><circle cx="76.116" cy="60" r="7"/><circle cx="97.714" cy="60" r="7"/></g>
</svg>
    <div class="heading">
      <h1>Psss</h1>
    </div>
    <div id="vaultbar" class="vaultbar" hidden>
      <svg class="icon vglyph" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-6"/></svg>
      <select id="vaultselect" aria-label="Vault"></select>
    </div>
    <button id="unlock" class="btn pri" type="button" hidden>Unlock</button>
  </header>
  <main>
    <div id="notice" class="notice" data-kind="info" hidden>
      <div class="txt">
        <strong id="noticetitle" hidden></strong>
        <p id="status" role="status"></p>
      </div>
      <button id="noticeunlock" class="btn pri" type="button" hidden>Unlock</button>
    </div>
    <section id="create" class="card pad" hidden>
      <h2 id="createtitle">Create a login</h2>
      <label id="accountlabel" for="account">Username or email</label>
      <input id="account" class="field" type="text" aria-label="Username or email" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button id="generate" class="btn pri wide" type="button">Generate, Fill and Save</button>
      <p id="created" role="status"></p>
    </section>
    <section id="search" hidden>
      <div class="searchhead">
        <div class="searchbox">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="Search all logins" aria-label="Search all logins" autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>
        <div id="pills" class="pills" role="group" aria-label="Found in" hidden></div>
      </div>
      <div id="results" aria-live="polite"></div>
    </section>
    <section id="sitegroup" hidden>
      <h2 id="forsite" class="s">For This Site</h2>
      <ul id="logins" class="card"></ul>
      <div id="sitenote" class="notice" data-kind="info" hidden>
        <div class="txt">
          <strong>No logins for this site</strong>
          <p id="sitenotebody"></p>
        </div>
      </div>
    </section>
    <p class="footer"><button id="settings" class="btn" type="button">Settings</button></p>
  </main>
  <script src="protocol.js"></script>
  <script src="origin.js"></script>
  <script src="display.js"></script>
  <script src="groups.js"></script>
  <script src="host.js"></script>
  <script src="page-fill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
