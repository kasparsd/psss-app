<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psss settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>Psss settings</h1>
    <section>
      <h2>Browser password prompts</h2>
      <p id="explain">This browser offers to save passwords itself. Psss can turn that off so you are not asked twice. Passwords already saved in the browser stay where they are.</p>
      <p id="state" role="status"></p>
      <button id="toggle" type="button"></button>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
